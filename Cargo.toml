[package]
name = "rust-editor"
version = "0.0.1"
edition = "2021"
description = "Rust Editor - Friday Night Funkin chart editor"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", features = ["default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15.3"
rodio = "0.20.1"
image = { version = "0.25", default-features = false, features = ["png"] }
